<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Pixl Calculator</title>
    <link rel="shortcut icon" href="121212.png" type="image">
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <h1>
        <div id="title-pixl">Pixl</div>
        <div id="title-calc">Calculator</div>
    </h1>

    <form action="">
        <div class="input-square">
            <input type="number" value="15" min="0" id="in-hours">
            <h3>Hours</h3>
        </div>
        
        <div class="input-square">
            <input type="number" value="2" min="1" max="4" id="in-tier">
            <h3>Tier</h3>
        </div>
    </form>

    <div id="output">
        <span id="out-px">~865px</span>
        <span id="out-dollar">~$60.57</span>
        <span id="out-re">~150RE</span>
    </div>

    <p id="disclaimer">Note: these values are an unofficial estimation based on the official docs. They are not a guarantee, so please do not use them as such.</p>

    <script src="script.js"></script>
</body>
</html>
